<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheering You On!</title>
    <style>
        /* Elegant, soft silk background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, #fffafb 0%, #f3e5e8 50%, #e5e0e5 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #333;
        }

        /* Refined glassmorphism card */
        .container {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
            max-width: 600px;
            width: 90%;
            box-sizing: border-box;
        }

        /* Lighter, more sophisticated typography */
        h1 {
            margin-top: 0;
            color: #4a4a4a;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 30px;
            color: #666;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Softer video shadow */
        video {
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            outline: none;
            background-color: #f8f8f8;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Muted, classy accent color */
        .encouragement {
            margin-top: 30px;
            font-weight: 500;
            font-size: 1.15rem;
            color: #8b7377;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You've Got This! 🎉</h1>
        <p>Just a little reminder of your happy energy before you go in there and crush it.</p>
        
        <video controls autoplay loop muted playsinline>
            <source src="dancing-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="encouragement">Good luck on the final interview! ❤️</div>
    </div>
</body>
</html>
